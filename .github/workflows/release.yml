name: Release

on:

  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Sanity Checks
      - name: Sanity Check - Linting
        run: pnpm --filter @repo/ui lint

      - name: Sanity Check - Unit Tests
        run: pnpm --filter @repo/ui test

      - name: Sanity Check - Typecheck & Bundling
        run: pnpm --filter @repo/ui build

      - name: Sanity Check - Storybook
        run: pnpm --filter docs build-storybook

      # Package generation (tarball via npm pack inside packages/ui)
      - name: Generate UI Tarball Package
        id: pack-ui
        run: |
          cd packages/ui
          TARBALL_NAME=$(npm pack)
          echo "tarball_name=$TARBALL_NAME" >> "$GITHUB_OUTPUT"
          echo "tarball_path=packages/ui/$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      # Upload tarball as a GitHub Actions workflow artifact
      - name: Upload UI Package Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack-ui.outputs.tarball_name }}
          path: ${{ steps.pack-ui.outputs.tarball_path }}
          retention-days: 30

      # Changesets: creates "Version Packages" PR or publishes and creates GitHub Release with notes
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Attach the tarball to the published GitHub Release
      - name: Attach Tarball to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Published packages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "\(.name)@\(.version)"' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Attaching ${{ steps.pack-ui.outputs.tarball_path }} to release $tag..."
              gh release upload "$tag" "${{ steps.pack-ui.outputs.tarball_path }}" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
