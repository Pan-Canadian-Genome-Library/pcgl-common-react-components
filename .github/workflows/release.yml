name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI Package
        run: pnpm turbo run build --filter=@repo/ui

      - name: Generate UI Tarball Package
        id: pack-ui
        working-directory: packages/ui
        run: |
          TARBALL_NAME=$(npm pack)
          echo "tarball_name=$TARBALL_NAME" >> "$GITHUB_OUTPUT"
          echo "tarball_path=packages/ui/$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      # Steps guarded with `!env.ACT` touch GitHub (artifacts, PRs, tags, releases)
      # and are skipped when testing locally with act.
      - name: Upload UI Package Tarball Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack-ui.outputs.tarball_name }}
          path: ${{ steps.pack-ui.outputs.tarball_path }}
          retention-days: 30

      # While changesets are pending, opens or updates the "Version Packages" PR.
      # Once it is merged, tags @repo/ui@<version> and creates a GitHub Release with
      # the CHANGELOG notes. @repo is an unclaimable npm scope, so nothing goes to npm.
      - name: Create Release Pull Request or Tag Release
        id: changesets
        if: ${{ !env.ACT }}
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset git-tag

      - name: Attach Tarball to GitHub Release
        if: ${{ !env.ACT && steps.changesets.outputs.published == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          TARBALL_PATH: ${{ steps.pack-ui.outputs.tarball_path }}
        run: |
          echo "$PUBLISHED_PACKAGES" \
            | jq -r '.[] | select(.name == "@repo/ui") | "\(.name)@\(.version)"' \
            | while read -r tag; do
                gh release upload "$tag" "$TARBALL_PATH" --clobber
              done
