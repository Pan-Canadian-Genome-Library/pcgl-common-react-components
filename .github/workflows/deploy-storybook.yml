name: Build and Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Versions come from package.json (packageManager) and .nvmrc.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build-storybook depends on ^build, so turbo builds @repo/ui first.
      - name: Build Storybook
        run: pnpm turbo run build-storybook --filter=docs

      # Skipped when testing locally with act; these publish to GitHub Pages.
      - name: Upload Pages artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'apps/docs/storybook-static'

      - id: deploy
        name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        uses: actions/deploy-pages@v5
