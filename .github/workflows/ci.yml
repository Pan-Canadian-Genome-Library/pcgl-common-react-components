name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefixed with "ci-" so it never collides with a calling workflow's group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # Versions come from package.json (packageManager) and .nvmrc.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint, Typecheck, Test and Build
        run: pnpm turbo run lint typecheck test build build-storybook
